<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SSGO Web - Баланс грунта</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#141418;color:#eee}
#app{display:flex;height:100vh}
#panel{width:360px;padding:16px;background:#1c1c22;overflow-y:auto;flex-shrink:0}
#view{flex:1;position:relative}
h1{font-size:18px;margin:0 0 12px}
.group{background:#26262e;border-radius:8px;padding:12px;margin-bottom:12px}
.group h2{font-size:13px;margin:0 0 8px;color:#9ab;text-transform:uppercase;letter-spacing:.5px}
label{display:block;font-size:12px;margin:8px 0 2px;color:#ccd}
input[type=range]{width:100%}
.val{float:right;color:#7fd;font-weight:bold}
button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:6px;background:#2ea36a;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
button.secondary{background:#3a3a44}
#stats{font-size:13px;line-height:1.7}
#stats b{color:#7fd}
#debug{font-size:11px;line-height:1.6;color:#aab;white-space:pre-wrap;font-family:monospace}
.slope-btn{display:block;width:100%;margin:4px 0;padding:10px;background:#2e2e38;color:#eee;border:1px solid #444;border-radius:6px;cursor:pointer;text-align:left;font-size:14px;font-weight:normal}
.slope-btn.active{background:#2ea36a;border-color:#2ea36a}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
@media(max-width:800px){#app{flex-direction:column-reverse}#panel{width:100%;max-height:45vh}}
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>SSGO Web — Баланс грунта</h1>
    <div class="group">
      <h2>Склон</h2>
      <button class="slope-btn active" data-slope="slope1">Склон 1 (тест)</button>
      <button class="slope-btn" data-slope="slope2">Склон 2 (тест)</button>
    </div>
    <div class="group">
      <h2>Параметры</h2>
      <label>Угол откоса, ° <span class="val" id="vAng">35°</span></label>
      <input type="range" id="pAng" min="5" max="60" step="0.5" value="35"/>
      <label>Сглаживание профиля <span class="val" id="vProf">0</span></label>
      <input type="range" id="pProf" min="0" max="10" step="1" value="0"/>
      <label>Макс. глубина срезки, м <span class="val" id="vCut">3.0</span></label>
      <input type="range" id="pCut" min="0" max="20" step="0.5" value="3"/>
      <label>Пригодно к использованию, % <span class="val" id="vUse">90%</span></label>
      <input type="range" id="pUse" min="10" max="100" step="5" value="90"/>
      <label>Сдвиг трассы, м <span class="val" id="vOff">0.0</span></label>
      <input type="range" id="pOff" min="-5" max="5" step="0.1" value="0"/>
      <label>Поперечный уклон, % <span class="val" id="vCr">0.0</span></label>
      <input type="range" id="pCr" min="-5" max="5" step="0.1" value="0"/>
      <label>Подъём/опускание трассы, м <span class="val" id="vDy">0.0</span></label>
      <input type="range" id="pDy" min="-10" max="10" step="0.1" value="0"/>
      <div class="chk"><input type="checkbox" id="pDbg" checked/> <span>Debug: кривые + каркас</span></div>
    </div>
    <div class="group">
      <h2>Отчёт по грунту (оценка)</h2>
      <div id="stats">Загрузка…</div>
    </div>
    <div class="group">
      <h2>Debug</h2>
      <div id="debug">-</div>
    </div>
    <button id="save">Сохранить конфигурацию</button>
    <button class="secondary" id="reset">Сбросить</button>
  </div>
  <div id="view"></div>
</div>
<script type="importmap">
{"imports":{
 "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
 "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="./main.js?v=7"></script>
</body>
</html>
