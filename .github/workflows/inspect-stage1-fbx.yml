name: Inspect Terrain and Stage1 FBX geometry

on:
  pull_request:
    paths:
      - 'clients/alpine-resort/models/slopes_stage1.fbx'
      - 'clients/alpine-resort/models/slopes_stage1.glb'
      - 'clients/alpine-resort/scene.json'
      - 'app.v192.js'
      - '.github/scripts/inspect-stage1-runtime-source.mjs'
      - 'stage-one-material-groups.v1.js'
      - 'scripts/test-stage-one-material-groups.mjs'
  push:
    branches: [main]
    paths:
      - 'clients/alpine-resort/models/slopes_stage1.fbx'
      - 'clients/alpine-resort/models/slopes_stage1.glb'
      - 'clients/alpine-resort/scene.json'
      - 'assets/real-terrain.fbx'
      - 'assets/real-terrain.json'
      - 'app.v192.js'
      - 'index.html'
      - '.github/workflows/inspect-stage1-fbx.yml'
      - '.github/scripts/inspect-stage1-fbx.mjs'
      - '.github/scripts/inspect-stage1-runtime-source.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the same Three.js version used by the app
        run: npm install --no-save --no-package-lock three@0.160.0
      - name: Parse FBX with the browser's FBXLoader
        run: node .github/scripts/inspect-stage1-fbx.mjs
      - name: Test Stage1 material-group compaction against the actual FBX
        run: node --test scripts/test-stage-one-material-groups.mjs
      - name: Inspect the exact published Stage1 source and GLB structure
        run: node .github/scripts/inspect-stage1-runtime-source.mjs
