name: Grade Optimizer quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Maya exporter Python syntax
        run: python -m py_compile maya/grade_optimizer_exporter.py
      - name: Validate Maya exporter integration
        run: node scripts/validate-maya-exporter.mjs
      - name: Check active browser module syntax
        run: |
          node --input-type=module --check < app.v178.js
          node --input-type=module --check < multiplayer.v10.js
          node --input-type=module --check < drone-controller.v76.js
      - name: Check standalone WebGPU lab modules
        run: |
          node --input-type=module --check < solar-cycle.v1.js
          node --input-type=module --check < webgpu-atmosphere-lab.js
          node --input-type=module --check < webgpu-atmosphere-lab.v2.js
          node --input-type=module --check < webgpu-forest-lab.js
      - name: Check multiplayer module syntax
        run: |
          node --input-type=module --check < skier-controller.v98.js
          node --input-type=module --check < multiplayer.v1.js
          node --input-type=module --check < server/src/protocol.v2.js
          node --input-type=module --check < server/src/worker.js
      - name: Test multiplayer protocol
        run: node --test server/test/*.test.mjs
      - name: Validate project
        run: node scripts/validate-project.mjs
