name: Grade Optimizer quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check active Forest Lab physical sky and snow PBR modules
        run: |
          node --input-type=module --check < webgpu-forest-lab.v4.js
          node --input-type=module --check < webgpu-forest-lab.v12.js
          node --input-type=module --check < webgpu-forest-lab.v13.js
          node --input-type=module --check < webgpu-forest-lab.v14.js
          node --input-type=module --check < webgpu-forest-lab.v15.js
          node --input-type=module --check < webgpu-forest-lab.v16.js
          node --input-type=module --check < webgpu-forest-lab.v17.js
          node --input-type=module --check < webgpu-forest-lab.v18.js
          node --input-type=module --check < webgpu-forest-lab.v19.js
          node --input-type=module --check < webgpu-forest-lab.v20.js
          node --input-type=module --check < webgpu-forest-lab.v21.js
          node --input-type=module --check < webgpu-forest-lab.v22.js
          node scripts/test-forest-spruce-v13.mjs
          node scripts/test-forest-spruce-v14.mjs
          node scripts/test-forest-spruce-v15.mjs
          node scripts/test-forest-spruce-v16.mjs
          node scripts/test-forest-spruce-v18.mjs
          node scripts/test-forest-spruce-v19.mjs
          node scripts/test-forest-spruce-v20.mjs
          node --input-type=module --check < webgpu-forest-atmosphere.v2.js
          node --input-type=module --check < webgpu-forest-atmosphere.v3.js
          node --input-type=module --check < webgpu-forest-atmosphere.v4.js
          node --input-type=module --check < webgpu-forest-atmosphere.v1.js
          node --input-type=module --check < solar-cycle.v1.js
          node --input-type=module --check < webgpu-cloud-layer.v3.js
          node --input-type=module --check < stage-one-materials.v1.js
          node scripts/test-stage-one-materials.mjs
          node scripts/test-forest-pbr-materials.mjs
      - name: Check Maya exporter Python syntax
        run: python -m py_compile maya/grade_optimizer_exporter.py
      - name: Test Maya FBX and GLB replacement inventory
        run: python scripts/test-maya-asset-replacement.py
      - name: Validate Maya exporter integration
        run: node scripts/validate-maya-exporter.mjs
      - name: Check active browser module syntax
        run: |
          node --input-type=module --check < app.v210.js
          node --input-type=module --check < app.v211.js
          node --input-type=module --check < app.v212.js
          node --input-type=module --check < app.v213.js
          node --input-type=module --check < app.v214.js
          node --input-type=module --check < app.v215.js
          node --input-type=module --check < app.v216.js
          node --input-type=module --check < app.v217.js
          node --input-type=module --check < app.v218.js
          node --input-type=module --check < safety-fences.v1.js
          node --input-type=module --check < safety-fences.v2.js
          node --input-type=module --check < stage-one-materials.v1.js
          node --input-type=module --check < editor-shared-materials.v1.js
          node --input-type=module --check < stage-one-material-groups.v1.js
          node --input-type=module --check < render-performance.v1.js
          node --input-type=module --check < weather-system.v9.js
          node --input-type=module --check < slope-label-index.v1.js
          node --input-type=module --check < skier-controller.v104.js
          node --input-type=module --check < skier-terrain-contact.v4.js
          node --input-type=module --check < skier-view-presentation.v1.js
          node --input-type=module --check < multiplayer.v11.js
          node --input-type=module --check < drone-controller.v76.js
      - name: Check standalone WebGPU lab modules
        run: |
          node --input-type=module --check < alpine-lab.v1.js
          node --input-type=module --check < solar-cycle.v1.js
          node --input-type=module --check < webgpu-cloud-layer.v1.js
          node --input-type=module --check < webgpu-atmosphere-lab.js
          node --input-type=module --check < webgpu-atmosphere-lab.v2.js
          node --input-type=module --check < webgpu-forest-lab.js
      - name: Check multiplayer module syntax
        run: |
          node --input-type=module --check < multiplayer.v1.js
          node --input-type=module --check < server/src/protocol.v2.js
          node --input-type=module --check < server/src/worker.js
      - name: Test shared imported material consolidation
        run: node scripts/test-editor-shared-materials.mjs
      - name: Test Stage1 semantic material sharing
        run: node scripts/test-stage-one-materials.mjs
      - name: Test multiplayer protocol
        run: node --test server/test/*.test.mjs
      - name: Test skier terrain contact transitions
        run: node --test scripts/test-skier-terrain-contact.mjs scripts/test-skier-custom-spawn.mjs scripts/test-skier-surface-physics.mjs scripts/test-skier-view-presentation.mjs
      - name: Test slope angle label spatial culling
        run: node --test scripts/test-slope-label-index.mjs
      - name: Test render performance fallbacks
        run: node --test scripts/test-render-performance.mjs
      - name: Test automatic steep-edge safety fence placement
        run: node scripts/test-safety-fences.mjs
      - name: Test H3 centerline safety fence placement
        run: node --test scripts/test-safety-fences-v2.mjs
      - name: Validate project
        run: node scripts/validate-project.mjs
