name: Grade Optimizer quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Maya exporter Python syntax
        run: python -m py_compile maya/grade_optimizer_exporter.py
      - name: Validate Maya exporter integration
        run: node scripts/validate-maya-exporter.mjs
      - name: Check active browser module syntax
        run: |
          node --input-type=module --check < app.v192.js
          node --input-type=module --check < stage-one-material-groups.v1.js
          node --input-type=module --check < render-performance.v1.js
          node --input-type=module --check < weather-system.v9.js
          node --input-type=module --check < slope-label-index.v1.js
          node --input-type=module --check < skier-controller.v99.js
          node --input-type=module --check < skier-terrain-contact.v1.js
          node --input-type=module --check < multiplayer.v10.js
          node --input-type=module --check < drone-controller.v76.js
      - name: Check standalone WebGPU lab modules
        run: |
          node --input-type=module --check < solar-cycle.v1.js
          node --input-type=module --check < webgpu-cloud-layer.v1.js
          node --input-type=module --check < webgpu-atmosphere-lab.js
          node --input-type=module --check < webgpu-atmosphere-lab.v2.js
          node --input-type=module --check < webgpu-forest-lab.js
      - name: Check multiplayer module syntax
        run: |
          node --input-type=module --check < multiplayer.v1.js
          node --input-type=module --check < server/src/protocol.v2.js
          node --input-type=module --check < server/src/worker.js
      - name: Test multiplayer protocol
        run: node --test server/test/*.test.mjs
      - name: Test skier terrain contact transitions
        run: node --test scripts/test-skier-terrain-contact.mjs
      - name: Test slope angle label spatial culling
        run: node --test scripts/test-slope-label-index.mjs
      - name: Test render performance fallbacks
        run: node --test scripts/test-render-performance.mjs
      - name: Validate project
        run: node scripts/validate-project.mjs
