name: Grade Optimizer quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Maya exporter Python syntax
        run: python -m py_compile maya/grade_optimizer_exporter.py
      - name: Validate Maya exporter integration
        run: node scripts/validate-maya-exporter.mjs
      - name: Check active browser module syntax
        run: node --input-type=module --check < app.v161.js
      - name: Validate project
        run: node scripts/validate-project.mjs
